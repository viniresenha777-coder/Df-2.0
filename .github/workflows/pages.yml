name: Publicar Fronteira Morta 2.0

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "recuperar.html"
      - "js/**"
      - "css/**"
      - "img/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Importar ZIP da Release (se houver)
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/unpacked"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir "$RUNNER_TEMP/release"
          mapfile -d '' zips < <(find "$RUNNER_TEMP/release" -maxdepth 1 -type f -iname '*.zip' -print0)
          test "${#zips[@]}" -eq 1 || { echo "::error::Adicione apenas um ZIP à Release."; exit 1; }
          unzip -tq "${zips[0]}" >/dev/null
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/unpacked"
          test -f "$RUNNER_TEMP/unpacked/index.html" || { echo "::error::O ZIP deve ter index.html na raiz."; exit 1; }
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='README.md' --exclude='supabase/' "$RUNNER_TEMP/unpacked/" "$GITHUB_WORKSPACE/"
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Importa Release $RELEASE_TAG"
            git push origin HEAD:main
          fi

      - name: Configurar Node para empacotar o jogo
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gerar e registrar bundle ofuscado atualizado
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/fm-compiler" --no-audit --no-fund javascript-obfuscator@4.1.1
          FM_OBFUSCATOR="$RUNNER_TEMP/fm-compiler/node_modules/javascript-obfuscator" python3 tools/empacotar.py --game-only
          # Importação única dos dois atlas gerados dos GLBs rigados (8 direções).
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/bd51b13b-ed61-43d0-9d33-b8d6003a0756.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWQ3ZDQ3NjRjMmZjZWVlNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTUwMTU0MH0.4COIDzwQ7XUvo8zdxGBpiA5qxB36vUTj65wa88eP9Wo' -o img/boss_natal_santa_atlas.png
          test "$(stat -c%s img/boss_natal_santa_atlas.png)" -gt 70000
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/31bcd449-1779-45ff-af23-837e49833f34.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTEwYmMyNjQ5NGUzOGQ1MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsImV4cCI6MTc5NTU2NDEzMn0.hTlDwiU8dLig_NgIVsVMUYRN0EiRP9g9Bwu0ovSzI5s' -o img/boss_natal_alce_atlas.png
          test "$(stat -c%s img/boss_natal_alce_atlas.png)" -gt 70000
          git add index.html js/jogo.min.js img/boss_natal_santa_atlas.png img/boss_natal_alce_atlas.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Atualiza bundle da Glock 18"
            git push origin HEAD:main
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar site com arquivos da main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='README.md' --exclude='supabase/' "$GITHUB_WORKSPACE/" "$RUNNER_TEMP/site/"
          test -f "$RUNNER_TEMP/site/index.html"
          test -f "$RUNNER_TEMP/site/js/login.js"
          test -f "$RUNNER_TEMP/site/js/cloud.js"
          test -f "$RUNNER_TEMP/site/js/checkpoint.js"

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
